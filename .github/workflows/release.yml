name: Build and publish .deb packages

# Triggers:
#   - push to main         -> build matrix + publish rolling pre-release at tag "continuous"
#   - push of tag v*       -> build matrix + publish full release
#   - workflow_dispatch    -> manual run (publishes a continuous build by default)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'PLAN.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the built .deb files'
        type: boolean
        default: true

env:
  PROJECT_NAME: inkcut-cpp

# Avoid stacking up expensive (especially armhf) builds when several commits
# land back-to-back. The newest run wins.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Native amd64/arm64 builds on hosted runners ---------------------------
  native:
    name: ${{ matrix.codename }} / ${{ matrix.arch }} (native)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner:   ubuntu-22.04
            codename: jammy
            arch:     amd64
          - runner:   ubuntu-22.04-arm
            codename: jammy
            arch:     arm64
          - runner:   ubuntu-24.04
            codename: noble
            arch:     amd64
          - runner:   ubuntu-24.04-arm
            codename: noble
            arch:     arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # qt6-l10n-tools provides lconvert/lupdate/lrelease — on
          # Ubuntu 22.04 qt6-tools-dev declares Qt6::lconvert as an
          # imported target but does not depend on the package that
          # ships the binary, so CMake's find_package(Qt6 LinguistTools)
          # fails. Always pull it in explicitly.
          # libgl-dev / libegl-dev: Qt6Gui's CMake config requires
          # WrapOpenGL which probes OPENGL_INCLUDE_DIR. qt6-base-dev
          # only Recommends it, so under --no-install-recommends find_package(Qt6 Gui)
          # fails. Pull it in explicitly.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6serialport6-dev libqt6svg6-dev \
            libgl-dev libegl-dev \
            libpotrace-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package (.deb via CPack)
        working-directory: build
        run: cpack -G DEB

      - name: Rename .deb (codename + arch)
        working-directory: build
        run: |
          set -eux
          for f in *.deb; do
            base="${f%.deb}"
            mv "$f" "${base}_${{ matrix.codename }}_${{ matrix.arch }}.deb"
          done
          ls -la *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.codename }}-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  # --- armhf cross-build via Docker + QEMU (for Rockchip RK3128, RPi 32-bit) -
  armhf:
    name: ${{ matrix.codename }} / armhf (QEMU)
    strategy:
      fail-fast: false
      matrix:
        include:
          - codename: jammy   # Ubuntu 22.04 — target for RK3128
            image:    arm32v7/ubuntu:22.04
          - codename: noble   # Ubuntu 24.04 armhf (best-effort)
            image:    arm32v7/ubuntu:24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          # Pin QEMU to v8.1.5 — newer binfmt images ship qemu 9/10 which
          # have a regression causing apt-get install to fail inside
          # arm32v7 containers with "Could not open lock file
          # /var/lib/dpkg/lock-frontend - Permission denied" (despite
          # running as root). See tonistiigi/binfmt#245.
          image: tonistiigi/binfmt:qemu-v8.1.5
          platforms: arm

      - name: Build inside ${{ matrix.image }}
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}:/src" -w /src \
            -e DEBIAN_FRONTEND=noninteractive \
            ${{ matrix.image }} bash -eux -c '
              apt-get update
              # git: required by CMake FetchContent (libdxfrw).
              # qt6-l10n-tools: provides lconvert/lupdate/lrelease that
              # Qt6LinguistTools imports as Qt6::lconvert (see comment
              # in the native job).
              # libgl-dev / libegl-dev: needed by Qt6Gui's WrapOpenGL
              # find_dependency (see comment in the native job).
              apt-get install -y --no-install-recommends \
                cmake ninja-build g++ pkg-config ca-certificates git \
                qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
                qt6-l10n-tools \
                libqt6serialport6-dev libqt6svg6-dev \
                libgl-dev libegl-dev \
                libpotrace-dev \
                dpkg-dev fakeroot
              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_CXX_FLAGS="-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard"
              cmake --build build -j$(nproc)
              QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure || true
              cd build && cpack -G DEB
            '

      - name: Rename .deb (armhf + codename)
        working-directory: build
        run: |
          set -eux
          for f in *.deb; do
            base="${f%.deb}"
            # CPack writes arch as "armhf" automatically when dpkg-deb is present
            mv "$f" "${base}_${{ matrix.codename }}_armhf.deb"
          done
          ls -la *.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.codename }}-armhf
          path: build/*.deb
          if-no-files-found: error

  # --- Aggregate and publish release ----------------------------------------
  release:
    name: Publish GitHub Release
    needs: [native, armhf]
    # Skip for PRs entirely; otherwise always publish (either continuous or tagged).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deb-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Compute SHA256 sums
        working-directory: dist
        run: sha256sum *.deb > SHA256SUMS.txt

      - name: Determine release parameters
        id: rel
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            {
              echo "tag=${tag}"
              echo "name=Inkcut C++ ${tag}"
              echo "prerelease=false"
              echo "make_latest=true"
              echo "is_continuous=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=continuous"
              echo "name=Continuous build (main @ ${short_sha})"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "is_continuous=true"
            } >> "$GITHUB_OUTPUT"
          fi

      # For rolling releases we replace the previous "continuous" release wholesale
      # so the release page shows only the freshest .deb files for the latest main.
      - name: Remove previous "continuous" release
        if: steps.rel.outputs.is_continuous == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete continuous \
            --yes --cleanup-tag \
            --repo "${{ github.repository }}" || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: ${{ steps.rel.outputs.make_latest }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          body: |
            Automated build of `${{ github.repository }}` from
            commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            on branch/ref `${{ github.ref_name }}`.

            **Packages**

            | Distro | Arch | File |
            |---|---|---|
            | Ubuntu 22.04 (jammy) | amd64  | `inkcut-cpp_*_jammy_amd64.deb` |
            | Ubuntu 22.04 (jammy) | arm64  | `inkcut-cpp_*_jammy_arm64.deb` |
            | Ubuntu 22.04 (jammy) | armhf  | `inkcut-cpp_*_jammy_armhf.deb` (RK3128, RPi 2/3 32-bit) |
            | Ubuntu 24.04 (noble) | amd64  | `inkcut-cpp_*_noble_amd64.deb` |
            | Ubuntu 24.04 (noble) | arm64  | `inkcut-cpp_*_noble_arm64.deb` |
            | Ubuntu 24.04 (noble) | armhf  | `inkcut-cpp_*_noble_armhf.deb` |

            SHA-256 checksums are in `SHA256SUMS.txt`.

            Install with:

            ```bash
            sudo apt install ./inkcut-cpp_*_<codename>_<arch>.deb
            ```
          files: |
            dist/*.deb
            dist/SHA256SUMS.txt
